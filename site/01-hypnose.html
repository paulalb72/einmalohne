<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OHNE – Hypnose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ohne-yellow: #FFF200;
    --ohne-yellow-deep: #F5DC00;
    --ohne-ink: #231F20;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ohne-yellow); }
  body { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; color: var(--ohne-ink); overflow-x: hidden; }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    isolation: isolate;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
  }
  #rings { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
  /* Tiefe: weiche Vignette + feines Korn */
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse at var(--cx, 70%) var(--cy, 60%), rgba(255,255,255,0) 30%, rgba(170,140,0,.22) 100%);
  }
  .hero::after {
    content: ""; position: absolute; inset: -50%; z-index: 5; pointer-events: none; opacity: .07; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain { 0%{transform:translate(0,0)} 33%{transform:translate(-3%,2%)} 66%{transform:translate(2%,-3%)} 100%{transform:translate(0,0)} }

  .copy {
    padding: 0 clamp(16px, 6vw, 96px);
    position: relative; z-index: 3;
  }
  .kicker {
    font-weight: 400; letter-spacing: .22em; text-transform: lowercase; font-size: clamp(14px, 1.2vw, 18px);
    opacity: 0; transform: translateY(14px);
  }
  h1 {
    font-weight: 800; text-transform: uppercase; line-height: .86; letter-spacing: -.01em;
    font-size: clamp(56px, 8.4vw, 148px); margin: .18em 0 .22em;
  }
  h1 span { display: block; overflow: hidden; }
  h1 span i { display: block; font-style: normal; transform: translateY(105%); }
  .lead { font-weight: 300; font-size: clamp(18px, 1.6vw, 26px); line-height: 1.3; max-width: 30ch; opacity: 0; transform: translateY(14px); }
  .cta {
    display: inline-flex; align-items: center; gap: .6em; margin-top: 1.6em;
    background: var(--ohne-ink); color: var(--ohne-yellow); text-decoration: none;
    font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 15px;
    padding: 1em 1.6em; border-radius: 999px; opacity: 0; transform: translateY(14px);
    transition: background .25s, color .25s;
  }
  .cta:hover { background: #fff; color: var(--ohne-ink); }
  .cta svg { transition: transform .25s; }
  .cta:hover svg { transform: translateX(4px); }

  .stage {
    position: relative; height: 100%; min-height: 100vh; min-height: 100svh;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 7vh;
  }
  .bottle-wrap {
    position: relative;
    height: min(80vh, 820px);
    aspect-ratio: 407 / 1800;
    will-change: transform;
  }
  #bottle { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  .shadow {
    position: absolute; left: 50%; bottom: -2.2%; width: 230%; height: 6%; z-index: 1;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(60,45,0,.55) 0%, rgba(60,45,0,.25) 35%, rgba(60,45,0,0) 70%);
    filter: blur(2px);
  }

  .loaded .kicker, .loaded .lead, .loaded .cta { transition: opacity .9s ease, transform .9s cubic-bezier(.2,.8,.2,1); opacity: 1; transform: none; }
  .loaded .kicker { transition-delay: .9s; }
  .loaded .lead   { transition-delay: 1.5s; }
  .loaded .cta    { transition-delay: 1.7s; }
  .loaded h1 span i { transition: transform 1s cubic-bezier(.2,.8,.2,1); transform: none; }
  .loaded h1 span:nth-child(1) i { transition-delay: 1.05s; }
  .loaded h1 span:nth-child(2) i { transition-delay: 1.2s; }

  .instant * { transition: none !important; }

  @media (max-width: 820px) {
    .hero { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .copy { padding-top: 40px; text-align: center; }
    .kicker { letter-spacing: .14em; font-size: 13px; }
    h1 { font-size: clamp(40px, 12.5vw, 84px); }
    .lead { margin: 0 auto; font-size: 18px; }
    .cta { margin-top: 1.1em; }
    .stage { min-height: 0; padding: 24px 0 5vh; }
    .bottle-wrap { height: min(54vh, 520px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero::after { animation: none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="rings" aria-hidden="true"></canvas>

  <div class="copy">
    <p class="kicker">weingut rosenhof · entalkoholisiert</p>
    <h1><span><i>Alles drin.</i></span><span><i>Außer Alkohol.</i></span></h1>
    <p class="lead">OHNE – voller Weingeschmack, entalkoholisiert und herrlich klar.</p>
    <a class="cta" href="#">Jetzt entdecken
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 6h16M11 1l5 5-5 5"/></svg>
    </a>
  </div>

  <div class="stage">
    <div class="bottle-wrap" id="bottleWrap">
      <div class="shadow" id="shadow"></div>
      <canvas id="bottle" role="img" aria-label="Flasche OHNE – entalkoholisierter Wein"></canvas>
    </div>
  </div>
</section>

<script>
(() => {
  // Etikett-Mittelpunkt und -Breite auf dem Flaschenfoto (Anteile der Bildgröße)
  const LABEL_CX = 0.503, LABEL_CY = 0.792, LABEL_W = 0.856;
  // Ringproportionen aus dem Etikett (198,43 Einheiten breit): weißer Ring ≈ 20, Periode ≈ 46
  const RING_PERIOD = 46 / 198.43, RING_DUTY = 20 / 46;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ?t=3 springt für Vorschau-Screenshots direkt zu Sekunde 3
  const T_OFF = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
  if (T_OFF) document.documentElement.classList.add('instant');
  const hero = document.getElementById('hero');
  const rings = document.getElementById('rings');
  const rctx = rings.getContext('2d');
  const bCanvas = document.getElementById('bottle');
  const bctx = bCanvas.getContext('2d');
  const wrap = document.getElementById('bottleWrap');
  const shadow = document.getElementById('shadow');
  const sheen = document.createElement('canvas');
  const sctx = sheen.getContext('2d');

  const img = new Image();
  img.src = 'assets/bottle.webp';

  let dpr = 1, W = 0, H = 0, bw = 0, bh = 0;
  let mouseX = 0.5, mouseY = 0.5, smx = 0.5, smy = 0.5;
  let t0 = 0, visible = true;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    rings.width = W * dpr; rings.height = H * dpr;
    bw = wrap.clientWidth; bh = wrap.clientHeight;
    bCanvas.width = sheen.width = Math.round(bw * dpr);
    bCanvas.height = sheen.height = Math.round(bh * dpr);
  }

  const easeOutBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const clamp01 = x => Math.max(0, Math.min(1, x));

  function drawRings(t, cx, cy, labelPx, reveal) {
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rctx.fillStyle = '#FFF200';
    rctx.fillRect(0, 0, W, H);

    // Periode wächst mit dem Radius – wie die immer breiteren Ringe auf dem Etikett
    const P0 = labelPx * RING_PERIOD;
    const L = labelPx * 1.6;
    const phi = r => (L / P0) * Math.log(1 + r / L);
    const rad = p => L * (Math.exp(p * P0 / L) - 1);
    const maxR = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + 40;
    const s = reduce ? 0 : t * 0.22;
    const kMax = Math.ceil(phi(maxR)) + 1;

    rctx.strokeStyle = '#FFFFFF';
    for (let k = -1; k <= kMax; k++) {
      let r0 = rad(Math.max(0, k + (s % 1)));
      let r1 = rad(Math.max(0, k + (s % 1) + RING_DUTY));
      if (r1 <= 0) continue;
      if (r0 > reveal) break;
      r1 = Math.min(r1, reveal);
      const w = r1 - r0;
      if (w <= 0.2) continue;
      rctx.lineWidth = w;
      rctx.beginPath();
      rctx.arc(cx, cy, r0 + w / 2, 0, Math.PI * 2);
      rctx.stroke();
    }
    // weiches Licht hinter der Flasche
    const g = rctx.createRadialGradient(cx, cy - labelPx * 1.5, 0, cx, cy - labelPx * 1.5, labelPx * 5);
    g.addColorStop(0, 'rgba(255,255,255,.35)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    rctx.fillStyle = g;
    rctx.fillRect(0, 0, W, H);
  }

  function band(x, width, peak) {
    const w = sheen.width, h = sheen.height;
    const g = sctx.createLinearGradient((x - width) * w, 0, (x + width) * w, 0);
    g.addColorStop(0, 'rgba(255,255,240,0)');
    g.addColorStop(0.42, `rgba(255,255,240,${peak * 0.25})`);
    g.addColorStop(0.5, `rgba(255,255,240,${peak})`);
    g.addColorStop(0.58, `rgba(255,255,240,${peak * 0.25})`);
    g.addColorStop(1, 'rgba(255,255,240,0)');
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, w, h);
  }

  function drawBottle(sweepX, baseX) {
    const w = bCanvas.width, h = bCanvas.height;
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.globalCompositeOperation = 'source-over';
    bctx.clearRect(0, 0, w, h);
    bctx.drawImage(img, 0, 0, w, h);

    // Glanzstreifen, nur auf dem Glas (destination-in mit dem Foto als Maske)
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, w, h);
    band(baseX, 0.12, 0.16);
    if (sweepX > -0.5) band(sweepX, 0.22, 0.42);
    // statische Kantenreflexe links und rechts für mehr Rundung
    const e = sctx.createLinearGradient(0, 0, w, 0);
    e.addColorStop(0.02, 'rgba(255,250,200,.20)');
    e.addColorStop(0.12, 'rgba(255,250,200,0)');
    e.addColorStop(0.88, 'rgba(255,250,200,0)');
    e.addColorStop(0.98, 'rgba(255,250,200,.28)');
    sctx.fillStyle = e;
    sctx.fillRect(0, 0, w, h);
    sctx.globalCompositeOperation = 'destination-in';
    sctx.drawImage(img, 0, 0, w, h);

    bctx.globalCompositeOperation = 'screen';
    bctx.drawImage(sheen, 0, 0);
    bctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    if (!t0) t0 = now;
    const t = (now - t0) / 1000 + T_OFF;

    smx += (mouseX - smx) * 0.06;
    smy += (mouseY - smy) * 0.06;

    // Intro: Flasche steigt auf, dann sanftes Schweben
    const intro = reduce ? 1 : clamp01(t / 1.4);
    const rise = (1 - easeOutBack(intro)) * H * 0.6;
    const float = reduce ? 0 : Math.sin(t * 1.3) * 7 * clamp01(t - 1.4);
    const px = (smx - 0.5) * 14, py = (smy - 0.5) * 8;
    const rot = reduce ? 0 : (smx - 0.5) * 2.2 + Math.sin(t * 0.9) * 0.4;
    wrap.style.transform = `translate3d(${px}px, ${rise + float + py}px, 0) rotate(${rot}deg)`;
    wrap.style.opacity = clamp01(intro * 3);
    const lift = (float + 7) / 14; // 0 = unten, 1 = oben
    shadow.style.transform = `translateX(-50%) translateY(${-float - py - rise}px) scale(${1 - lift * 0.12})`;
    shadow.style.opacity = (0.95 - lift * 0.25) * clamp01((intro - 0.5) * 2);

    // Ringzentrum folgt dem Etikett
    const rect = wrap.getBoundingClientRect();
    const hr = hero.getBoundingClientRect();
    const cx = rect.left - hr.left + rect.width * LABEL_CX;
    const cy = rect.top - hr.top + rect.height * LABEL_CY;
    const labelPx = rect.width * LABEL_W;
    const reveal = reduce ? 1e5 : easeOutCubic(clamp01((t - 0.9) / 2.2)) * Math.hypot(W, H) * 1.1;
    drawRings(t, cx, cy, labelPx, reveal);
    hero.style.setProperty('--cx', (cx / W * 100) + '%');
    hero.style.setProperty('--cy', (cy / H * 100) + '%');

    // Glanz: automatischer Sweep alle 5 s, Maus verschiebt den Grundreflex
    const cyc = ((t + 3) % 5) / 5;
    const sweep = cyc < 0.35 ? -0.4 + easeOutCubic(cyc / 0.35) * 1.8 : -1;
    drawBottle(reduce ? -1 : sweep, 0.3 + (smx - 0.5) * 0.35);

    if (visible) requestAnimationFrame(frame);
  }

  addEventListener('pointermove', e => { mouseX = e.clientX / innerWidth; mouseY = e.clientY / innerHeight; });
  addEventListener('resize', resize);
  new IntersectionObserver(([en]) => {
    const was = visible; visible = en.isIntersecting;
    if (visible && !was) requestAnimationFrame(frame);
  }).observe(hero);

  img.onload = () => {
    resize();
    document.body.classList.add('loaded');
    requestAnimationFrame(frame);
  };
})();
</script>
</body>
</html>
